<!DOCTYPE html>
<html>
<head>
    <title>Language Predictor</title>
</head>
<body>
    <h1>Language Predictor</h1>
    <form id="predictForm">
        <textarea name="text" id="text" rows="4" cols="50" placeholder="Enter text here"></textarea><br><br>
        <button type="submit">Predict Language</button>
    </form>
    
    <h2>Result:</h2>
    <pre id="result"></pre>

    <script>
        const form = document.getElementById("predictForm");
        const resultDiv = document.getElementById("result");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const text = document.getElementById("text").value.trim();

            if (!text) {
                resultDiv.innerText = "Error: Please enter some text.";
                return;
            }

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: `text=${encodeURIComponent(text)}`
                });

                const data = await response.json();
                console.log(data); // Debug: see API response in console

                if (data.error) {
                    resultDiv.innerText = "Error: " + data.error;
                } else {
                    resultDiv.innerText =
                        `Input Text: ${data.input_text}\n` +
                        `Predicted Language: ${data.predicted_language}\n` +
                        `Probabilities:\n${JSON.stringify(data.probabilities, null, 2)}`;
                }
            } catch (err) {
                resultDiv.innerText = "Error: Could not reach server.";
                console.error(err);
            }
        });
    </script>
</body>
</html>
